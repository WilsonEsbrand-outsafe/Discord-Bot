name: Economy probe (read-only)
on:
  push:
    branches: [claude/project-thread-rfyftm]
    paths: [.github/workflows/eco-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /home/ubuntu/discord-bot || exit 1
            echo "배포 커밋: $(git rev-parse --short HEAD)"
            python3 - <<'PY'
            import sqlite3
            con = sqlite3.connect("file:data/economy.sqlite3?mode=ro", uri=True)
            print("purse", con.execute("SELECT owner, coins FROM farm_purse ORDER BY coins DESC").fetchall())
            print("farms", con.execute("SELECT owner, COUNT(*), SUM(plots), MAX(land) FROM farms GROUP BY owner ORDER BY 2 DESC").fetchall())
            print("fields", con.execute("SELECT key, ench, COUNT(*) FROM farm_fields WHERE key IS NOT NULL GROUP BY key, ench ORDER BY 3 DESC LIMIT 15").fetchall())
            print("seeds", con.execute("SELECT key, SUM(qty) FROM farm_seeds GROUP BY key ORDER BY 2 DESC LIMIT 20").fetchall())
            print("wallet of purse owners", con.execute("SELECT p.owner, w.balance FROM farm_purse p LEFT JOIN wallets w ON w.user_id=p.owner").fetchall())
            PY
