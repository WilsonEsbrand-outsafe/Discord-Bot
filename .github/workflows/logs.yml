name: Server logs (read-only)

# 봇을 재시작하지 않고 서버 로그와 DB 상태만 본다.
# 실행: GitHub → Actions → "Server logs (read-only)" → Run workflow
#       또는  gh workflow run logs.yml -f minutes=60
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "최근 몇 분 로그"
        default: "30"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/discord-bot || exit 1
            echo "배포 커밋: $(git rev-parse --short HEAD)"
            systemctl is-active discord-bot
            sudo journalctl -u discord-bot --since "${{ github.event.inputs.minutes }} min ago" --no-pager | tail -n 200
            echo "── 토토 자동 정산 로그 ──"
            sudo journalctl -u discord-bot --since "${{ github.event.inputs.minutes }} min ago" --no-pager | grep -E "AUTO-SETTLE|IMPORT" | tail -n 60
            python3 - <<'PY'
            import sqlite3
            con = sqlite3.connect("file:data/economy.sqlite3?mode=ro", uri=True)
            q = lambda s: con.execute(s).fetchone()[0]
            print("긴 선수 ID 남은 수:", q("SELECT COUNT(*) FROM pm_players WHERE player_id LIKE 'P%' AND length(player_id) > 10"))
            print("선수 번호 최대:", q("SELECT MAX(CAST(player_id AS INTEGER)) FROM pm_players WHERE player_id NOT LIKE 'AMT_%'"))
            print("현역 선수 수:", q("SELECT COUNT(*) FROM pm_players WHERE retired=0 AND player_id NOT LIKE 'AMT_%'"))
            print("구단 수:", q("SELECT COUNT(*) FROM clubs"))
            for t in ("pm_price_history", "pm_news", "pm_holdings", "pm_listings", "pm_trade_items"):
                print(t, "행 수:", q(f"SELECT COUNT(*) FROM {t}"))
            print("가장 오래된 시세 기록(일 전):", q("SELECT (strftime('%s','now') - MIN(tick_ts)) / 86400 FROM pm_price_history"))
            print("토토 정산 안 된 경기 (킥오프 지난 것):")
            for r in con.execute("SELECT match_id, home, away, datetime(kickoff_ts, 'unixepoch', '+9 hours'), status, "
                                 "(SELECT COUNT(*) FROM toto_bets b WHERE b.match_id=m.match_id) FROM toto_matches m "
                                 "WHERE status!='settled' AND kickoff_ts <= strftime('%s','now') ORDER BY kickoff_ts"):
                print("  ", r)
            import json, urllib.request, datetime as dt
            try:   # 2.9.1 UFC 필터가 쓰는 ESPN 대진표 (키 없음 · 무료)
                d0 = dt.datetime.utcnow()
                url = ("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?limit=100&dates="
                       f"{(d0 - dt.timedelta(days=1)):%Y%m%d}-{(d0 + dt.timedelta(days=30)):%Y%m%d}")
                data = json.load(urllib.request.urlopen(url, timeout=10))
                print("ESPN UFC 대진표:")
                for ev in data.get("events", []):
                    fights = [" vs ".join((c.get("athlete") or {}).get("displayName", "?") for c in comp.get("competitors", []))
                              for comp in ev.get("competitions", [])]
                    print("  ", ev.get("date"), ev.get("name"), f"{len(fights)}경기:", " / ".join(fights))
            except Exception as e:
                print("ESPN 조회 실패:", e)
            import os
            for f in ("data/economy.sqlite3", "data/economy.sqlite3-wal"):
                if os.path.exists(f):
                    print(f, "%.1f MB" % (os.path.getsize(f) / 1e6))
            PY
